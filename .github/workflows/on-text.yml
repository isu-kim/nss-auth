name: On Text

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Text received on iPhone"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: on-text
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate README and site
        env:
          MESSAGE: ${{ github.event.inputs.message }}
        run: |
          SAFE=$(printf '%s' "$MESSAGE" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')
          NOW=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')

          cat > README.md <<EOF
          <div align="center">

          <h1 align="center">$SAFE</h1>

          <sub>Last updated: $NOW</sub>

          </div>
          EOF

          mkdir -p site
          cat > site/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Latest message</title>
            <style>
              html, body { height: 100%; margin: 0; }
              body {
                display: flex; flex-direction: column;
                align-items: center; justify-content: center;
                font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
                background: #111; color: #fff; text-align: center;
              }
              h1 { font-size: 4rem; margin: 0 0 1rem; word-break: break-all; }
              small { color: #888; }
            </style>
          </head>
          <body>
            <h1>$SAFE</h1>
            <small>Last updated: $NOW</small>
          </body>
          </html>
          EOF

      - name: Commit and push README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update README from iPhone text"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
