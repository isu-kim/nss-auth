name: On Text

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Text received on iPhone"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Do something
        env:
          MESSAGE: ${{ github.event.inputs.message }}
        run: |
          echo "Got message: $MESSAGE"
