name: On Text

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Text received on iPhone"
        required: false
        default: ""

permissions:
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Create issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: ${{ github.event.inputs.message }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Text received: ${MESSAGE:0:50}" \
            --body "$MESSAGE"
